[package]
name = "destiny-fetch"
version = "0.1.0"
edition = "2024"

[lib]
name = "destinypedia"
path = "src/lib.rs"

[[bin]]
name = "destiny-fetch"
path = "src/main.rs"

[dependencies]
async-channel = "2.5.0"
clap = { version = "4.6.1", features = ["unstable-doc", "cargo", "derive"] }
crossbeam-channel = "0.5.15"
derive_more = { version = "2.1.1", features = ["display", "error", "from", "try_from"] }
diesel = { version = "2.3.9", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
dirs = "6.0.0"
dotenvy = "0.15.7"
rayon = "1.12.0"
reqwest = { version = "0.13.2", features = ["json", "query", "blocking" ] }
rusqlite = { version = "0.39.0", features = ["rusqlite-macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_with = { version = "3.19.0", features = ["guide"] }
serde_with_macros = "3.19.0"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["rt", "macros", "full", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
serde_test = "1.0.177"

