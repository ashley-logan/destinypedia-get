[package]
name = "destiny-fetch"
version = "0.1.0"
edition = "2024"

[lib]
name = "destinypedia"
path = "src/lib.rs"

[[bin]]
name = "destiny-fetch"
path = "src/main.rs"

[dependencies]
async-channel = "2.5.0"
better-tracing = "0.6.0"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["unstable-doc", "cargo", "derive"] }
crossbeam-channel = "0.5.15"
derive_more = { version = "2.1.1", features = ["display", "error", "from", "try_from"] }
dirs = "6.0.0"
dotenvy = "0.15.7"
futures = "0.3.32"
inquire = "0.9.4"
rayon = "1.12.0"
reqwest = { version = "0.13.2", features = ["json", "query", "blocking" ] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_with = { version = "3.19.0", features = ["guide"] }
serde_with_macros = "3.19.0"
sqlx = { version = "0.9.0", features = ["sqlite", "chrono", "derive", "macros", "migrate", "runtime-tokio"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["rt", "macros", "full", "time", "io-util"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
serde_test = "1.0.177"

